<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Yarn ball -->
    <circle cx="0" cy="0" r="100" fill="white" opacity="0.95"/>
    <path d="M -80 -30 Q -40 -80 0 -60 Q 40 -40 60 -80" stroke="#9333ea" stroke-width="8" fill="none" opacity="0.6"/>
    <path d="M -70 20 Q -20 -20 30 0 Q 80 20 90 -20" stroke="#ec4899" stroke-width="8" fill="none" opacity="0.6"/>
    <path d="M -60 60 Q 0 30 60 60" stroke="#9333ea" stroke-width="8" fill="none" opacity="0.6"/>
    <!-- Knitting needles -->
    <line x1="-120" y1="120" x2="80" y2="-80" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="-80" y2="-80" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-120" cy="120" r="12" fill="white"/>
    <circle cx="120" cy="120" r="12" fill="white"/>
  </g>
</svg>
